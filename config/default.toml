[app]
name = "AI Accent Converter Studio"
version = "0.9.4"
year = 2026

[audio]
sample_rate = 48000
block_size = 1024
dtype = "float32"
max_input_seconds = 900

[conversion]
default_source_accent = "en-US"
default_target_accent = "en-GB"
preserve_timbre = true
rhoticity_strength = 0.85
prosody_transfer = 0.7
pitch_shift_semitones = 0.0
formant_warp = 1.0

[models]
voicepack_dir = "voices"
encoder = "models/accent_encoder_v3.onnx"
decoder = "models/accent_decoder_v3.onnx"
pitch_tracker = "models/crepe_tiny.onnx"

[updates]
check_on_start = true
channel = "stable"

[debug]
allow_remote_dsp = false
log_level = "INFO"